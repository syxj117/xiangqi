<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f0c987" />
  <title>中国象棋</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1 class="app__title">中 国 象 棋</h1>
      <div class="app__status" id="status">红方先行</div>
    </header>

    <main class="app__board-wrap">
      <canvas id="board" class="board"></canvas>
    </main>

    <footer class="app__footer" data-play-only>
      <button class="btn" id="btn-undo" type="button">悔棋</button>
      <button class="btn btn--primary" id="btn-restart" type="button">重新开始</button>
      <button class="btn" id="btn-flip" type="text">翻转视角</button>
      <button class="btn" id="btn-2p" type="button">本地双人</button>
    </footer>

    <footer class="app__footer app__footer--second" data-play-only>
      <button class="btn btn--toggle" id="btn-settings" type="button">AI 设置</button>
      <button class="btn btn--edit" id="btn-edit-mode" type="button">模拟编辑</button>
      <span class="app__think" id="ai-thinking" hidden>AI 思考中…</span>
    </footer>

    <!-- AI 互弈控制条 (仅 AI vs AI 显示) -->
    <footer class="app__footer app__footer--replay" id="replay-bar" data-play-only hidden>
      <button class="btn btn--small" id="btn-replay-pause" type="button">暂停</button>
      <button class="btn btn--small" id="btn-replay-step" type="button">单步</button>
      <select class="modal__select modal__select--speed" id="replay-speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
      </select>
    </footer>

    <!-- 局面评分 + 计时 -->
    <div class="app__meta" data-play-only>
      <span class="app__meta-item" id="score-board">局面: 均势</span>
      <span class="app__meta-item app__meta-item--red" id="time-red"></span>
      <span class="app__meta-item app__meta-item--black" id="time-black"></span>
    </div>

    <!-- AI 思考进度条 -->
    <div class="thinking-progress" id="thinking-progress" hidden>
      <div class="thinking-progress__bar" id="thinking-bar"></div>
    </div>

    <p class="app__tip" id="tip-play" data-play-only>点击棋子选中，再点击目标位置完成走子。在「AI 设置」中配置 AI 对手。</p>

    <div class="editor" id="editor" hidden>
      <div class="editor__row">
        <span class="editor__label">红方</span>
        <div class="editor__pieces" id="editor-red"></div>
      </div>
      <div class="editor__row">
        <span class="editor__label">黑方</span>
        <div class="editor__pieces" id="editor-black"></div>
      </div>
      <div class="editor__actions">
        <button class="btn btn--small" id="btn-edit-clear" type="button">清空</button>
        <button class="btn btn--small" id="btn-edit-default" type="button">标准开局</button>
        <button class="btn btn--small btn--primary" id="btn-edit-start" type="button">开始对弈</button>
      </div>
      <p class="editor__tip" id="editor-tip">点棋子选中，再点空格放置；点已有棋子可移除。特殊棋子（帅/士/相）会自动限制可放位置。</p>
    </div>
  </div>

  <!-- AI 设置面板 (模态弹窗) -->
  <div class="modal-overlay" id="settings-overlay" hidden>
    <div class="modal">
      <header class="modal__header">
        <h2 class="modal__title">AI 对手设置</h2>
        <button class="modal__close" id="btn-close-settings" type="button">✕</button>
      </header>

      <section class="modal__section">
        <h3 class="modal__subtitle">对弈模式</h3>
        <div class="modal__row">
          <label class="modal__label">红方</label>
          <select class="modal__select" id="select-red"></select>
        </div>
        <div class="modal__row">
          <label class="modal__label">黑方</label>
          <select class="modal__select" id="select-black"></select>
        </div>
        <p class="modal__hint">选择"人类"由你操作，选择 AI 或"内置AI"自动走棋。红黑都选 AI 即可实现 AI 对弈。</p>
      </section>

      <section class="modal__section">
        <h3 class="modal__subtitle">个性化设置</h3>
        <div class="modal__row">
          <label class="modal__label">AI 难度</label>
          <select class="modal__select" id="select-level">
            <option value="1">入门</option>
            <option value="2">初级</option>
            <option value="3" selected>中级</option>
            <option value="4">高级</option>
          </select>
        </div>
        <div class="modal__row">
          <label class="modal__label">棋盘皮肤</label>
          <select class="modal__select" id="select-skin">
            <option value="classic" selected>经典木色</option>
            <option value="wood">深木</option>
            <option value="jade">翡翠</option>
            <option value="ink">水墨</option>
          </select>
        </div>
        <div class="modal__row">
          <label class="modal__label">每方限时</label>
          <select class="modal__select" id="select-time">
            <option value="0" selected>不限</option>
            <option value="180">3 分钟</option>
            <option value="300">5 分钟</option>
            <option value="600">10 分钟</option>
            <option value="900">15 分钟</option>
          </select>
        </div>
      </section>

      <section class="modal__section">
        <h3 class="modal__subtitle">添加 AI 接口</h3>
        <div class="modal__row">
          <input class="modal__input" id="cfg-name" type="text" placeholder="名称 (如: 我的GPT)" />
        </div>
        <div class="modal__row">
          <input class="modal__input" id="cfg-baseurl" type="text" placeholder="API Base URL (如: https://api.openai.com/v1)" />
        </div>
        <div class="modal__row">
          <input class="modal__input" id="cfg-apikey" type="password" placeholder="API Key" />
        </div>
        <div class="modal__row">
          <input class="modal__input" id="cfg-model" type="text" placeholder="模型名 (如: gpt-4o-mini)" />
        </div>
        <button class="btn btn--primary modal__add-btn" id="btn-add-ai" type="button">添加 AI</button>
      </section>

      <section class="modal__section">
        <h3 class="modal__subtitle">已配置的 AI</h3>
        <div class="modal__list" id="ai-list">
          <p class="modal__empty">暂无 AI 配置，请在上方添加。</p>
        </div>
      </section>
    </div>
  </div>

  <script src="./ai-api.js?v=20260921e"></script>
  <script src="./game.js?v=20260921e"></script>
</body>
</html>
